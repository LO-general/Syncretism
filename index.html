<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Syncretism</title>
    
    <!-- Google Tag Manager / Analytics -->
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-MWJ4GJLC"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    </script>

    <!-- SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%; height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #050308;
            color: #f3e8ff;
        }

        /* Fond animé fluide aux ondes violettes d'origine */
        .bg-canvas {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            background: radial-gradient(circle at 30% 30%, #1e1135 0%, #0a0512 50%, #030107 100%);
        }

        .wave-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2;
            opacity: 0.6;
            pointer-events: none;
            background: 
                radial-gradient(ellipse at 80% 20%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 20% 80%, rgba(88, 28, 135, 0.25) 0%, transparent 60%);
        }

        .overlay-gradient {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 70%, rgba(76, 29, 149, 0.1), rgba(5, 3, 8, 0.85) 85%);
            z-index: 3;
            pointer-events: none;
        }

        /* Écran de Connexion / Inscription */
        .auth-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 50;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: rgba(5, 3, 8, 0.75);
            backdrop-filter: blur(15px);
            transition: opacity 0.5s ease;
        }

        .auth-container.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .auth-box {
            background: rgba(20, 15, 30, 0.8);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(25px);
            text-align: center;
        }

        .auth-box h2 {
            font-size: 1.8rem;
            font-weight: 400;
            color: #ede9fe;
            margin-bottom: 8px;
        }

        .auth-box p {
            font-size: 0.9rem;
            color: #a78bfa;
            margin-bottom: 30px;
        }

        .auth-input {
            width: 100%;
            background: rgba(10, 7, 18, 0.6);
            border: 1px solid rgba(139, 92, 246, 0.25);
            border-radius: 12px;
            padding: 14px 18px;
            color: #f3e8ff;
            font-size: 1rem;
            margin-bottom: 15px;
            outline: none;
            transition: all 0.3s;
        }

        .auth-input:focus {
            border-color: rgba(167, 139, 250, 0.8);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.3);
        }

        .auth-input.hidden-field {
            display: none;
        }

        .auth-btn {
            width: 100%;
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.5);
            transition: background 0.2s, transform 0.2s;
            margin-top: 10px;
        }

        .auth-btn:hover {
            background: #6d28d9;
            transform: translateY(-1px);
        }

        .auth-switch {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #9ca3af;
        }

        .auth-switch span {
            color: #c084fc;
            cursor: pointer;
            text-decoration: underline;
        }

        /* Interface principale de l'application */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        header {
            text-align: center;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        header.hidden {
            opacity: 0;
            transform: translateY(-20px);
            pointer-events: none;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            color: #ede9fe;
            margin-bottom: 8px;
            text-shadow: 0 2px 20px rgba(139, 92, 246, 0.4);
        }

        p.subtitle {
            font-size: 0.95rem;
            color: #a78bfa;
            opacity: 0.8;
        }

        /* Boutons du haut */
        .top-nav {
            position: fixed;
            top: 24px; right: 24px;
            display: flex;
            gap: 10px;
            z-index: 20;
        }

        .action-btn {
            background: rgba(30, 20, 50, 0.5);
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: #e9d5ff;
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 0.85rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: rgba(76, 29, 149, 0.6);
            border-color: rgba(167, 139, 250, 0.6);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
        }

        /* Barre de saisie ovale épurée */
        .input-wrapper {
            width: 100%;
            max-width: 600px;
            margin-bottom: 40px;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .input-box {
            display: flex;
            align-items: center;
            background: rgba(20, 15, 30, 0.65);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 999px;
            padding: 12px 20px;
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .input-box:focus-within {
            border-color: rgba(167, 139, 250, 0.9);
            box-shadow: 0 0 35px rgba(139, 92, 246, 0.5);
            background: rgba(30, 20, 50, 0.85);
        }

        .input-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #f3e8ff;
            font-size: 1rem;
            padding: 0 10px;
        }

        .input-box input::placeholder {
            color: rgba(216, 180, 254, 0.4);
        }

        .send-btn {
            background: #7c3aed;
            color: white;
            border: none;
            width: 38px; height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(124, 58, 237, 0.6);
            transition: transform 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.05);
            background: #6d28d9;
        }

        /* Vue centrale "Mes dossiers" */
        .folders-view {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 90px 20px 40px 20px;
            background: rgba(5, 3, 8, 0.4);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .folders-view.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Croix de fermeture en haut à droite */
        .close-folders-btn {
            position: fixed;
            top: 24px; right: 24px;
            background: rgba(30, 20, 50, 0.6);
            border: 1px solid rgba(139, 92, 246, 0.3);
            color: #e9d5ff;
            width: 42px; height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            z-index: 40;
        }

        .close-folders-btn:hover {
            background: rgba(76, 29, 149, 0.8);
            border-color: rgba(167, 139, 250, 0.7);
            transform: scale(1.05);
        }

        .folders-header-title {
            font-size: 1.6rem;
            font-weight: 400;
            color: #ede9fe;
            margin-bottom: 20px;
            text-align: center;
            text-shadow: 0 2px 20px rgba(139, 92, 246, 0.4);
        }

        /* Barre de recherche stylisée */
        .search-wrapper {
            width: 100%;
            max-width: 600px;
            margin-bottom: 25px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: rgba(20, 15, 30, 0.65);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 999px;
            padding: 12px 20px;
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .search-box:focus-within {
            border-color: rgba(167, 139, 250, 0.9);
            box-shadow: 0 0 35px rgba(139, 92, 246, 0.5);
            background: rgba(30, 20, 50, 0.85);
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #f3e8ff;
            font-size: 1rem;
            padding: 0 10px;
        }

        .search-box input::placeholder {
            color: rgba(216, 180, 254, 0.4);
        }

        .folders-container {
            width: 100%;
            max-width: 700px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 30px;
        }

        /* Cartes de dossiers */
        .folder-card {
            background: rgba(20, 15, 30, 0.6);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 20px;
            padding: 24px;
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .folder-card:hover {
            border-color: rgba(167, 139, 250, 0.7);
            background: rgba(30, 20, 50, 0.8);
            box-shadow: 0 0 30px rgba(139, 92, 246, 0.3);
        }

        .folder-title { 
            font-weight: 500; 
            color: #ede9fe; 
            margin-bottom: 10px; 
            font-size: 1.2rem; 
            text-transform: capitalize; 
            letter-spacing: 0.03em;
        }

        .folder-summary { 
            font-size: 0.9rem; 
            color: #d8b4fe; 
            margin-bottom: 14px; 
            line-height: 1.5; 
            font-style: italic; 
            background: rgba(139, 92, 246, 0.12); 
            padding: 12px 16px; 
            border-radius: 12px; 
            border-left: 3px solid #a78bfa; 
        }

        .folder-items { 
            font-size: 0.85rem; 
            color: #9ca3af; 
            border-top: 1px solid rgba(139, 92, 246, 0.15); 
            padding-top: 10px; 
            line-height: 1.5;
        }

        /* Notification de classement */
        .toast {
            position: fixed;
            bottom: 100px;
            background: rgba(76, 29, 149, 0.85);
            backdrop-filter: blur(10px);
            color: #f3e8ff;
            padding: 10px 20px;
            border-radius: 999px;
            font-size: 0.85rem;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 1000;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
    </style>
</head>
<body>

    <!-- Arrière-plan animé fluide -->
    <canvas class="bg-canvas" id="bgCanvas"></canvas>
    <div class="wave-layer"></div>
    <div class="overlay-gradient"></div>

    <!-- Écran de Connexion / Inscription -->
    <div class="auth-container" id="authContainer">
        <div class="auth-box">
            <h2 id="authTitle">Connexion</h2>
            <p id="authSubtitle">Accédez à votre espace Syncretism</p>
            
            <input type="email" id="authEmail" class="auth-input" placeholder="Adresse email" />
            <input type="password" id="authPassword" class="auth-input" placeholder="Mot de passe" />
            <input type="password" id="authPasswordConfirm" class="auth-input hidden-field" placeholder="Confirmer le mot de passe" />
            
            <button class="auth-btn" id="authSubmitBtn" onclick="handleAuth()">Se connecter</button>
            
            <div class="auth-switch" id="authSwitchText">
                Pas encore de compte ? <span onclick="toggleAuthMode()">S'inscrire</span>
            </div>
        </div>
    </div>

    <!-- Navigation du haut -->
    <div class="top-nav">
        <button class="action-btn" id="navFoldersBtn" onclick="toggleFoldersView()">Mes dossiers</button>
        <button class="action-btn" onclick="logout()" style="background: rgba(150, 30, 30, 0.4); border-color: rgba(239, 68, 68, 0.3);">Déconnexion</button>
    </div>

    <!-- Application Principale -->
    <div class="app-container" id="appContainer">
        <header id="mainHeader">
            <h1>Syncretism</h1>
            <p class="subtitle" id="welcomeUser">Le premier mot nomme le dossier, l'IA résume.</p>
        </header>

        <div class="input-wrapper">
            <div class="input-box">
                <input type="text" id="ideaInput" placeholder="Ex: TikTok concept vidéo..." onfocus="activateFocus()" onblur="checkBlur()" />
                <button class="send-btn" onclick="submitIdea()" title="Envoyer">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Vue Centrale "Mes dossiers" avec la petite croix en haut à droite -->
    <div class="folders-view" id="foldersView">
        <button class="close-folders-btn" onclick="toggleFoldersView()" title="Fermer">&times;</button>
        <div class="folders-header-title">Mes Dossiers & Résumés</div>
        
        <!-- Barre de recherche stylisée -->
        <div class="search-wrapper">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Rechercher un dossier ou une note..." oninput="updateFoldersUI()" />
                <svg width="16" height="16" fill="none" stroke="rgba(216, 180, 254, 0.6)" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path></svg>
            </div>
        </div>

        <div class="folders-container" id="foldersList"></div>
    </div>

    <div class="toast" id="toast">Idée classée dans le dossier !</div>

    <script>
        // Initialisation de Supabase
        const SUPABASE_URL = 'https://lemarquandquetard.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_-9Ww5TjE2ymqlAsA2mqiLQ_8cKQo8dw';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Animation des vagues violettes en arrière-plan
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let step = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function drawWaves() {
            ctx.clearRect(0, 0, width, height);
            step += 0.008;

            for (let i = 0; i < 4; i++) {
                ctx.beginPath();
                ctx.moveTo(0, height);
                
                for (let x = 0; x < width; x += 20) {
                    let y = height * 0.5 + 
                            Math.sin(x * 0.003 + step + i) * 80 + 
                            Math.cos(x * 0.002 - step * 0.5) * 60 + 
                            i * 50;
                    ctx.lineTo(x, y);
                }
                
                ctx.lineTo(width, height);
                ctx.closePath();

                let grad = ctx.createLinearGradient(0, 0, width, height);
                grad.addColorStop(0, `rgba(76, 29, 149, ${0.08 + i * 0.04})`);
                grad.addColorStop(1, `rgba(20, 10, 35, ${0.4 + i * 0.1})`);
                ctx.fillStyle = grad;
                ctx.fill();
            }
            requestAnimationFrame(drawWaves);
        }
        drawWaves();

        // Gestion de l'authentification avec Supabase
        let isRegisterMode = false;
        let currentUser = localStorage.getItem('syncretism_current_user');

        const authContainer = document.getElementById('authContainer');
        const authTitle = document.getElementById('authTitle');
        const authSubtitle = document.getElementById('authSubtitle');
        const authSubmitBtn = document.getElementById('authSubmitBtn');
        const authSwitchText = document.getElementById('authSwitchText');
        const authEmail = document.getElementById('authEmail');
        const authPassword = document.getElementById('authPassword');
        const authPasswordConfirm = document.getElementById('authPasswordConfirm');
        const welcomeUser = document.getElementById('welcomeUser');

        function checkAuthSession() {
            if (currentUser) {
                authContainer.classList.add('hidden');
                welcomeUser.textContent = `Connecté en tant que : ${currentUser}`;
                loadUserFolders();
            } else {
                authContainer.classList.remove('hidden');
            }
        }

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            if (isRegisterMode) {
                authTitle.textContent = "Inscription";
                authSubtitle.textContent = "Créez votre espace personnel sécurisé";
                authSubmitBtn.textContent = "S'inscrire";
                authPasswordConfirm.classList.remove('hidden-field');
                authSwitchText.innerHTML = `Déjà un compte ? <span onclick="toggleAuthMode()">Se connecter</span>`;
            } else {
                authTitle.textContent = "Connexion";
                authSubtitle.textContent = "Accédez à votre espace Syncretism";
                authSubmitBtn.textContent = "Se connecter";
                authPasswordConfirm.classList.add('hidden-field');
                authSwitchText.innerHTML = `Pas encore de compte ? <span onclick="toggleAuthMode()">S'inscrire</span>`;
            }
        }

        async function handleAuth() {
            const email = authEmail.value.trim().toLowerCase();
            const password = authPassword.value.trim();
            const passwordConfirm = authPasswordConfirm.value.trim();

            if (!email || !password) {
                alert("Veuillez remplir tous les champs.");
                return;
            }

            if (isRegisterMode) {
                if (password !== passwordConfirm) {
                    alert("Les mots de passe ne correspondent pas. Veuillez vérifier.");
                    return;
                }
                const { error } = await supabaseClient.auth.signUp({ email, password });
                if (error) {
                    alert("Erreur lors de l'inscription : " + error.message);
                } else {
                    alert("Compte créé avec succès ! Connectez-vous.");
                    toggleAuthMode();
                }
            } else {
                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) {
                    alert("Email ou mot de passe incorrect.");
                } else {
                    currentUser = data.user.email;
                    localStorage.setItem('syncretism_current_user', currentUser);
                    authEmail.value = '';
                    authPassword.value = '';
                    authPasswordConfirm.value = '';
                    checkAuthSession();
                }
            }
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            localStorage.removeItem('syncretism_current_user');
            currentUser = null;
            folders = {};
            authContainer.classList.remove('hidden');
            if(foldersView.classList.contains('active')) toggleFoldersView();
        }

        // Gestion des dossiers connectés à Supabase
        let folders = {};

        async function loadUserFolders() {
            if (!currentUser) return;
            const { data, error } = await supabaseClient
                .from('user_folders')
                .select('folders_data')
                .eq('email', currentUser)
                .single();

            if (data && data.folders_data) {
                folders = data.folders_data;
            } else {
                folders = {};
            }
            updateFoldersUI();
        }

        async function saveUserFolders() {
            if (!currentUser) return;
            // On vérifie d'abord si une ligne existe pour cet utilisateur
            const { data } = await supabaseClient
                .from('user_folders')
                .select('email')
                .eq('email', currentUser)
                .single();

            if (data) {
                await supabaseClient
                    .from('user_folders')
                    .update({ folders_data: folders })
                    .eq('email', currentUser);
            } else {
                await supabaseClient
                    .from('user_folders')
                    .insert([{ email: currentUser, folders_data: folders }]);
            }
        }

        const inputField = document.getElementById('ideaInput');
        const header = document.getElementById('mainHeader');
        const foldersView = document.getElementById('foldersView');
        const foldersList = document.getElementById('foldersList');
        const searchInput = document.getElementById('searchInput');
        const navFoldersBtn = document.getElementById('navFoldersBtn');
        const toast = document.getElementById('toast');
        let isFoldersOpen = false;

        function activateFocus() {
            header.classList.add('hidden');
        }

        function checkBlur() {
            if (inputField.value.trim() === '') {
                header.classList.remove('hidden');
            }
        }

        inputField.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                submitIdea();
            }
        });

        function generateAISummary(items) {
            if (items.length === 1) {
                return `Objectif principal : ${items[0]}`;
            } else if (items.length === 2) {
                return `Synthèse : Axé sur "${items[0]}" avec un focus complémentaire sur "${items[1]}".`;
            } else {
                return `Résumé global (${items.length} idées consolidées) : Regroupe les axes autour de "${items[0]}" et de ses évolutions.`;
            }
        }

        async function submitIdea() {
            const text = inputField.value.trim();
            if (!text) return;

            const words = text.split(/\s+/);
            let folderName = words[0].replace(/[^a-zA-Z0-9À-ÿ]/g, "").toLowerCase();
            let cleanContent = words.slice(1).join(' ');

            if (!folderName) folderName = "général";
            if (!cleanContent) cleanContent = text;

            if (!folders[folderName]) {
                folders[folderName] = { items: [], summary: "" };
            }
            folders[folderName].items.push(cleanContent);
            folders[folderName].summary = generateAISummary(folders[folderName].items);

            await saveUserFolders();

            inputField.value = '';
            header.classList.remove('hidden');
            inputField.blur();

            showToast(`Classé dans [${folderName}]`);
            updateFoldersUI();
        }

        function showToast(msg) {
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function toggleFoldersView() {
            isFoldersOpen = !isFoldersOpen;
            if (isFoldersOpen) {
                foldersView.classList.add('active');
                navFoldersBtn.textContent = "Retour";
                searchInput.value = '';
                updateFoldersUI();
            } else {
                foldersView.classList.remove('active');
                navFoldersBtn.textContent = "Mes dossiers";
            }
        }

        function updateFoldersUI() {
            foldersList.innerHTML = '';
            const searchTerm = searchInput ? searchInput.value.trim().toLowerCase() : '';
            const keys = Object.keys(folders);
            
            const filteredKeys = keys.filter(key => {
                const folder = folders[key];
                const matchTitle = key.toLowerCase().includes(searchTerm);
                const matchSummary = folder.summary.toLowerCase().includes(searchTerm);
                const matchItems = folder.items.some(item => item.toLowerCase().includes(searchTerm));
                return matchTitle || matchSummary || matchItems;
            });

            if (filteredKeys.length === 0) {
                foldersList.innerHTML = '<p style="color: rgba(255,255,255,0.4); text-align: center; margin-top: 40px;">Aucun dossier trouvé.</p>';
                return;
            }

            filteredKeys.forEach(key => {
                const folder = folders[key];
                const notesListHTML = folder.items.map(item => `• ${item}`).join('<br>');
                
                const card = document.createElement('div');
                card.className = 'folder-card';
                card.innerHTML = `
                    <div class="folder-title">📁 ${key}</div>
                    <div class="folder-summary">✨ ${folder.summary}</div>
                    <div class="folder-items"><strong>Notes enregistrées :</strong><br>${notesListHTML}</div>
                `;
                foldersList.appendChild(card);
            });
        }

        checkAuthSession();
    </script>
</body>
</html>
